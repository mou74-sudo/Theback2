<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>AR Camera Layer</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    a-scene,
    video,
    canvas,
    .a-canvas,
    #arjs-video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      padding: 0 !important;
      transform: none !important;
      overflow: hidden !important;
    }

    video,
    #arjs-video {
      object-fit: cover !important;
      z-index: 1 !important;
    }

    canvas,
    .a-canvas {
      z-index: 2 !important;
    }

    .a-enter-vr,
    .arjs-loader,
    .a-loader-title {
      display: none !important;
    }
  </style>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
</head>

<body>
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false"
  >
    <!-- Hiro marker: fault records -->
    <a-marker preset="hiro" id="hiro-marker">
      <a-box
        id="ar-box"
        position="0 0.5 0"
        rotation="0 45 0"
        color="#38bdf8"
        scale="0.7 0.7 0.7"
        animation="property: rotation; to: 0 405 0; loop: true; dur: 3000"
      ></a-box>
      <a-text
        id="ar-label"
        value="Fault Record"
        position="-1.4 1.3 0"
        rotation="-90 0 0"
        color="#ffffff"
        width="4"
        align="center"
      ></a-text>
    </a-marker>

    <!-- Kanji marker: tool tracking records -->
    <a-marker preset="kanji" id="kanji-marker">
      <a-cylinder
        id="ar-tool-shape"
        position="0 0.5 0"
        radius="0.4"
        height="0.8"
        color="#a78bfa"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"
      ></a-cylinder>
      <a-text
        id="ar-tool-label"
        value="Tool Record"
        position="-1.4 1.3 0"
        rotation="-90 0 0"
        color="#ffffff"
        width="4"
        align="center"
      ></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const hiroMarker  = document.getElementById("hiro-marker");
    const kanjiMarker = document.getElementById("kanji-marker");
    const label       = document.getElementById("ar-label");
    const box         = document.getElementById("ar-box");
    const toolLabel   = document.getElementById("ar-tool-label");
    const toolShape   = document.getElementById("ar-tool-shape");

    let currentRecord = null;

    function updateARRecord(record) {
      currentRecord = record;

      if (!record) {
        label.setAttribute("value", "Fault Record");
        box.setAttribute("color", "#38bdf8");
        toolLabel.setAttribute("value", "Tool Record");
        toolShape.setAttribute("color", "#a78bfa");
        return;
      }

      const isTool = record.type === "tool";
      const displayText = `${record.title}\n${record.severity} · ${record.status}`;
      const colour = record.colour || (isTool ? "#a78bfa" : "#38bdf8");

      if (isTool) {
        toolLabel.setAttribute("value", displayText);
        toolShape.setAttribute("color", colour);
      } else {
        label.setAttribute("value", displayText);
        box.setAttribute("color", colour);
      }
    }

    window.addEventListener("message", event => {
      const message = event.data;
      if (!message || message.type !== "set-ar-record") return;
      updateARRecord(message.record);
    });

    hiroMarker.addEventListener("markerFound", () => {
      window.parent.postMessage({ type: "marker-found", markerType: "hiro" }, "*");
    });
    hiroMarker.addEventListener("markerLost", () => {
      window.parent.postMessage({ type: "marker-lost", markerType: "hiro" }, "*");
    });

    kanjiMarker.addEventListener("markerFound", () => {
      window.parent.postMessage({ type: "marker-found", markerType: "kanji" }, "*");
    });
    kanjiMarker.addEventListener("markerLost", () => {
      window.parent.postMessage({ type: "marker-lost", markerType: "kanji" }, "*");
    });

    window.parent.postMessage({ type: "ar-camera-ready" }, "*");
  </script>
</body>
</html>
