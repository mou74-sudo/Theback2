<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>AR Camera Layer</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    a-scene,
    video,
    canvas,
    .a-canvas,
    #arjs-video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      padding: 0 !important;
      transform: none !important;
      overflow: hidden !important;
    }

    video,
    #arjs-video {
      object-fit: cover !important;
      z-index: 1 !important;
    }

    canvas,
    .a-canvas {
      z-index: 2 !important;
    }

    .a-enter-vr,
    .arjs-loader,
    .a-loader-title {
      display: none !important;
    }
  </style>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
</head>

<body>
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false"
  >
    <a-marker preset="hiro" id="hiro-marker">
      <a-box
        id="ar-box"
        position="0 0.5 0"
        rotation="0 45 0"
        color="#38bdf8"
        scale="0.7 0.7 0.7"
        animation="property: rotation; to: 0 405 0; loop: true; dur: 3000"
      ></a-box>

      <a-text
        id="ar-label"
        value="Maintenance Record"
        position="-1.4 1.3 0"
        rotation="-90 0 0"
        color="#ffffff"
        width="4"
        align="center"
      ></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.getElementById("hiro-marker");
    const label = document.getElementById("ar-label");
    const box = document.getElementById("ar-box");

    function updateARRecord(record) {
      if (!record) {
        label.setAttribute("value", "Maintenance Record");
        box.setAttribute("color", "#38bdf8");
        return;
      }

      label.setAttribute(
        "value",
        `${record.title}\n${record.severity} · ${record.status}`
      );

      box.setAttribute("color", record.colour || "#38bdf8");
    }

    window.addEventListener("message", event => {
      const message = event.data;

      if (!message || message.type !== "set-ar-record") {
        return;
      }

      updateARRecord(message.record);
    });

    marker.addEventListener("markerFound", () => {
      window.parent.postMessage({ type: "marker-found" }, "*");
    });

    marker.addEventListener("markerLost", () => {
      window.parent.postMessage({ type: "marker-lost" }, "*");
    });

    window.parent.postMessage({ type: "ar-camera-ready" }, "*");
  </script>
</body>
</html>
